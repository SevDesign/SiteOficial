<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso à Proposta | Sev Market</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { padding: 0 1.5rem; }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .solicitar-link {
            display: block;
            background-color: #787878;
            text-decoration: none;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-50 flex items-center justify-center h-screen font-sans overflow-hidden">
    
    <!-- Background Effect -->
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-zinc-800/40 via-zinc-950 to-zinc-950"></div>

    <!-- Login Card -->
    <div class="relative z-10 w-full max-w-md p-8 bg-zinc-900 border border-zinc-800 rounded-3xl shadow-2xl text-center">
        
        <h1 class="text-3xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-slate-300">
            Acesse sua Proposta
        </h1>
        <p class="text-zinc-400 mb-8 text-sm">Digite o nome do seu projeto para visualizar o orçamento exclusivo.</p>

        <form id="loginForm" class="login-form">
            <div>
                <input
                    type="text"
                    id="proposalName"
                    class="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-zinc-50 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-zinc-600 text-center"
                    autocomplete="off"
                    required
                >
            </div>
            
            <button type="submit" class="w-full py-3 bg-blue-600 text-zinc-50 font-bold rounded-xl hover:bg-blue-500 transition-all shadow-[0_0_15px_rgba(59,130,246,0.2)] hover:shadow-[0_0_25px_rgba(59,130,246,0.4)]">
                Acessar Proposta
            </button>
            
            <a href="https://wa.me/5588994654939?text=Olá,%20gostaria%20de%20de%20solicitar%20uma%20consultoria%20gratuita." class="solicitar-link py-2 bg-zinc-600 text-zinc-50 font-bold rounded-xl">
                Solicitar Proposta
            </a>

            <p id="errorMessage" class="text-red-400 text-sm hidden">Proposta não encontrada. Verifique o nome ou solicite uma.</p>
        </form>
    </div>

    <script src="auth.js"></script>
</body>
</html>
